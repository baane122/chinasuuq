name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web-build:
    name: Web — typecheck, lint, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        working-directory: apps/web
        # NEXT_PUBLIC_* vars are baked in via next.config.ts env block, so no
        # secrets are needed for a type-only pass.
        run: npx tsc --noEmit

      - name: Verify no client references a missing column
        working-directory: apps/web
        # Four screens were dead in production on 2026-10-31 with this exact
        # class of bug — admin/quotes wrote `fees` (live column: service_fee),
        # admin/queue read orders.customer_name (it lives on the view), and
        # useProductVariants selected source_price/attributes/is_default. All of
        # them type-checked, linted and built, because the Supabase client is
        # loosely typed: the failure only appears at runtime as a 42703/PGRST204
        # toast. This compares every literal column list in apps/web/src against
        # scripts/schema-snapshot.json (exported from the live project) and fails
        # on any unknown column.
        # Negative control (2026-10-31): adding "*, fees" to the quotes select
        # reports `"fees" is not a column of "quotes"` and exits 1.
        run: npm run verify:schema

      - name: Verify no client calls a missing RPC or passes a wrong argument name
        working-directory: apps/web
        # `.rpc("name", { p_x })` is a string on the wire, so tsc sees nothing and
        # the Supabase client is loosely typed. A renamed parameter is answered
        # with PGRST202 ("could not find the function … in the schema cache") at
        # runtime, on a screen that swallows `{ error }` and therefore renders an
        # empty list instead of a failure. That is the column-contract bug one
        # level up, and nothing checked it.
        # This compares every literal .rpc() name and its top-level argument keys,
        # and every .from() relation, against scripts/contract-snapshot.json
        # (exported from the live project: 66 functions, 71 relations, input
        # parameters only — see proargmodes in the refresh script).
        # Negative control (2026-11-01): renaming p_days to p_dayz in
        # apps/web/src/lib/catalog.ts reports `"p_dayz" is not an argument of that
        # function (live: p_days, p_limit)` and exits 1; renaming fx_rates, or
        # from("exchange_rates"), fails the same way.
        run: npm run verify:contract

      - name: Verify admin list enrichment is URL-safe
        working-directory: apps/web
        # The Shipments console once put ~1000 order ids into a single `.in()`,
        # so the GET query string exceeded what the gateway accepts as a request
        # line. It failed, the fallback failed identically, and every shipment
        # rendered with no order link — a failed lookup drawn as missing data.
        # Enrichment now batches, and this gate pins the batching, the bounded
        # concurrency, and the rule that a failed chunk must be reported.
        # Negative control (2026-10-14): IN_CLAUSE_BATCH_SIZE =
        # Number.MAX_SAFE_INTEGER turns checks 1-7 red.
        run: npm run verify:joins

      - name: Verify the browser AI client
        working-directory: apps/web
        # The public quote assistant and the shipment concierge were dead on
        # arrival: client.ts sent apikey but no Authorization header, and with
        # Supabase's default verify_jwt the gateway answers 401 before ai-chat
        # runs — which looked like "the AI has nothing to say". This imports the
        # REAL module against a fake fetch and asserts the signed-in JWT (anon
        # fallback for guests) is on the wire, the body carries only what was
        # asked for, each HTTP status maps to a named failure (unauthorized /
        # rate_limited / server / empty / timeout / offline), a build without
        # the public env pair spends zero requests, and the conversation never
        # reaches the console.
        # Negative control (2026-10-14): deleting the Authorization header turns
        # 3 of 16 checks red; the file was then restored byte-identically
        # (sha256 e5323bc91336b3ff recorded before and after).
        run: npm run verify:ai

      - name: Verify the public tracking page tells failure from not-found
        working-directory: apps/web
        # /track probes two column shapes, so "no row matched" and "the request
        # never reached Postgres" both arrive as an empty result — and the page
        # used to answer both with a red "Order not found", which tells a
        # customer holding a paid, shipped order that their order does not
        # exist. src/lib/track/errors.ts separates them, Safari/undici/RN
        # wordings are matched by name (a real Postgres answer always carries a
        # code, so pairing a transport phrase with a code proves the pattern
        # list and not the fallback), and the page keeps unreachable as its own
        # UI state with a Try again action.
        # Negative control (2026-10-14): replacing the classifier's last line
        # with `return false` turns 3 of 18 red — including `fetch failed`,
        # which is how this change was found in the first place.
        run: npm run verify:track

      - name: Verify the admin console fails closed
        working-directory: apps/web
        # The RBAC loader used to destructure { data } and ignore { error }, so a
        # dropped network call became permCount null, which read as "permissions
        # not configured", which hit the documented fail-open and gave every
        # signed-in staff member AI-key editing and payment confirmation while the
        # screen showed an empty table. loadAdminPermissions() now carries
        # checksFailed and can() denies on it. This gate imports the real module
        # (only its react + ../supabase boundaries are rewritten), scripts the
        # PostgREST-shaped answers, and pins each decision: a clean grant opens
        # exactly its own section, a failed or unusable read denies, a genuinely
        # empty table keeps the bootstrap fail-open, super_admin needs no grant
        # walk, and a failed check is never cached — one bad request must not
        # lock an operator out for the rest of the session.
        # Negative control (2026-10-14): deleting the `if (perm.checksFailed)
        # return false` line turns 3 red, deleting the bootstrap fail-open 1,
        # caching a failed result 1, neutering sanitizeOrFilter 1, making
        # fx.fromLiveRow true after a failed read 1, and hiding the capped-
        # broadcast banner 1; every file restored byte-identically (permissions
        # 1a405b38e701aacd, supabase-data d8d46e3c8e5f7d51, fx eb9dae21745ea2f9,
        # notifications 5ebc98200423e308).
        run: npm run verify:admin

      - name: Verify the shipped APK is the build this source describes
        working-directory: apps/web
        # apps/web/public/app/chinasuuq.apk is a CHECKED-IN BINARY and nothing
        # rebuilds it. On 2026-10-30 it was found at v1.0.2 from 2 October while
        # the app had moved to 1.0.6: five weeks of fixes never reached a
        # customer, and every gate was green, because "the file exists and is a
        # zip" says nothing about which build it is.
        # This holds the binary to apps/mobile/apk-manifest.json on three axes —
        # its sha256, a digest of the mobile files Metro bundles (so shipping new
        # mobile code without a rebuild fails), and expo.version — and re-reads the
        # zip central directory itself so a truncated download cannot pass.
        # Docs and tooling edits do not trip it; app/src/assets edits do.
        # Negative controls (2026-11-01): appending a comment to
        # apps/mobile/src/lib/shipping.ts fails the source digest, bumping
        # app.json's version fails the version check, and truncating the APK
        # fails both the sha and the central directory.
        run: npm run verify:apk

      - name: Lint
        working-directory: apps/web
        # HARD GATE since the 2026-11 cleanup: the debt this step used to carry
        # (128 errors / 40 warnings) is gone, so a new finding now fails CI
        # instead of accumulating invisibly.
        #
        # What was fixed rather than silenced:
        #  · 78 `no-explicit-any` → real row/payload interfaces in
        #    src/lib/admin/supabase-data.ts and the pages that consume them
        #  · 40 `set-state-in-effect` → derived values computed during render
        #    (DataTable page clamp, layout search, Hero counter, ShelfCard draft),
        #    useSyncExternalStore for the theme/locale/table-preference stores,
        #    and one documented hook (src/lib/useLoaderEffect.ts) for genuine
        #    fetch-on-mount, which is what the React docs still prescribe
        #  · React correctness: donut chart no longer mutates during render,
        #    today's clock is sampled once outside the row renderer, the staff
        #    DepartmentField is no longer redefined every render (it remounted
        #    its <input> on each keystroke), the dragging card's index is state
        #    instead of a ref read during render, and /error uses <Link>
        #  · 31 unused imports/locals removed; the Orders page keeps its
        #    previously-dead select-all control, now wired up
        #
        # `no-img-element` is off in eslint.config.mjs with the reason (static
        # export + hotlinked marketplace CDNs); the per-image guarantees it
        # stands in for are asserted at each call site.
        run: npm run lint

      - name: Unit tests
        working-directory: apps/web
        # Behavioural unit tests for the pure modules, on a real runner. Kept
        # alongside the verify:* contract gates rather than replacing them:
        # those compare source against a live schema snapshot and have no
        # assertions a normal test could express, while these pin behaviour
        # (fail-closed roles, bounded .in() batching, transport-vs-answer) that
        # no static comparison can see.
        run: npm run test:unit

      - name: Build (static export)
        working-directory: apps/web
        run: npm run build

      - name: Verify static export output
        working-directory: apps/web
        run: |
          test -f out/app/chinasuuq.apk || { echo "out/app/chinasuuq.apk missing"; exit 1; }
          test -f out/index.html || { echo "out/index.html missing"; exit 1; }
          echo "Static export OK ($(du -sh out | cut -f1))"

      - name: Verify the APK is a complete archive
        working-directory: apps/web
        # Overlaps verify:apk on purpose: that one proves WHICH build it is, this
        # one proves the exported copy in out/ is byte-identical to public/.
        run: |
          # A truncated download still starts with PK\x03\x04 and has a plausible
          # byte count, but has no central directory, so Android rejects it as
          # "package appears to be invalid". Existence checks cannot see that.
          entries=$(unzip -l public/app/chinasuuq.apk | tail -1 | awk '{print $2}') || exit 1
          if [ -z "$entries" ] || [ "$entries" -lt 500 ]; then
            echo "public/app/chinasuuq.apk is not a complete APK archive (entries: ${entries:-0}); re-download from EAS"
            exit 1
          fi
          cmp public/app/chinasuuq.apk out/app/chinasuuq.apk
          echo "APK OK: $entries entries, $(stat -c%s public/app/chinasuuq.apk) bytes, exported unchanged"

      - name: Check APK download link wired in UI
        run: |
          grep -rq "app/chinasuuq.apk" apps/web/src || { echo "Landing page no longer references /app/chinasuuq.apk"; exit 1; }

  e2e:
    name: Web — Playwright against the static export
    runs-on: ubuntu-latest
    needs: web-build
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build the static export
        working-directory: apps/web
        # Playwright tests `out/`, not `next dev`. A dev server has its own
        # routing and its own error overlay, so it hides exactly the class of bug
        # this job exists to find (trailing-slash handling, a 404 that should be a
        # 404, a gate that only works when hydration is instant).
        run: npm run build

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
          restore-keys: playwright-${{ runner.os }}-

      - name: Install Playwright browsers
        working-directory: apps/web
        # ubuntu-latest ships Google Chrome, but installing the bundled Chromium
        # keeps this job independent of the runner image's Chrome version. The
        # project prefers the `chrome` channel (see playwright.config.ts) and
        # falls back to Chromium when PLAYWRIGHT_CHANNEL=chromium.
        run: npx playwright install --with-deps chromium

      - name: Run the end-to-end suite
        working-directory: apps/web
        env:
          # No secrets: every Supabase call is intercepted in e2e/helpers.ts, so
          # the suite is deterministic and runs offline.
          PLAYWRIGHT_CHANNEL: chromium
        run: npx playwright test --reporter=github,line

      - name: Upload the failure artefacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            apps/web/test-results
            apps/web/playwright-report
          retention-days: 7

  mobile-config:
    name: Mobile — Expo typecheck + Metro bundle
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/mobile/package-lock.json

      - name: Validate EAS + app config JSON/YAML
        run: |
          node -e "JSON.parse(require('fs').readFileSync('apps/mobile/app.json','utf8')); console.log('app.json OK')"
          node -e "JSON.parse(require('fs').readFileSync('apps/mobile/eas.json','utf8')); console.log('eas.json OK')"
          node -e "const y=require('js-yaml'); ['apps/mobile/.eas/workflows/build-dev.yml','apps/mobile/.eas/workflows/production.yml'].forEach(f=>y.load(require('fs').readFileSync(f,'utf8'))); console.log('workflows OK')" \
            || echo "::warning::js-yaml unavailable — skipped YAML validation"

      - name: Install mobile dependencies
        working-directory: apps/mobile
        # apps/mobile is a self-contained npm project (its own package-lock.json
        # and node_modules), NOT part of the root workspaces — see README.
        run: npm ci

      - name: Typecheck
        working-directory: apps/mobile
        # Verified locally: ~17s cold, exit 0. This is the hard gate — do NOT
        # wrap in continue-on-error.
        run: npx tsc --noEmit

      - name: Every mobile verify suite
        working-directory: apps/mobile
        # CI enumerated these suites one by one, which silently fell behind the
        # package: verify:auth-session, verify:authurl, verify:native-cookies,
        # verify:risk-suite and verify:usd-worded were all part of
        # `npm run verify` and none of them ran here. One command is one source
        # of truth, and a new suite is covered the moment it is added to the
        # script — no CI edit required.
        #
        # What the suites cover, in the words of the bugs they were written for:
        #  · the in-page WebView scheduler (heartbeat, idle backoff, retirement,
        #    bounded text snapshot, hard stop while hidden)
        #  · the translation client (40-string batches, warm cache costs zero
        #    calls, in-flight de-dup, a 9 s time-box, parking on 429/503)
        #  · the in-page translation pipeline (data-cs-orig/data-cs-tr marks, the
        #    120-text budget, language-switch restore, risk-widget guards)
        #  · the in-page USD overlay ("the customer never sees RMB" — a wrong
        #    figure is worse than a slow screen)
        #  · bounded .in() reads (a long uuid list is a long URL; a gateway
        #    answers 400 and paid orders render with no line items)
        #  · the shared marketplace login bridge (a hung read is worse than a
        #    slow one — injected cookies apply to the NEXT document)
        #  · the cart belongs to an account and money is quoted honestly
        #    (a device-wide key showed one customer another's basket)
        #  · auth session scope and the one-device rule
        #  · the auth URL parser (deep links for verify-email / set-password)
        #  · native cookie injection, the risk suite, worded CNY→USD prices
        # All are offline: stubbed DOM / Supabase / AsyncStorage, no device.
        run: npm run verify
      - name: Bundle with Metro (iOS export)
        working-directory: apps/mobile
        # Proves native module shims + every asset require() path resolve —
        # exactly what `tsc` cannot see. Verified locally: ~2m35s, 81 files,
        # 5.8MB Hermes bundle. Fits well inside a CI window.
        env:
          EXPO_NO_TELEMETRY: "1"
          CI: "1"
        run: |
          rm -rf /tmp/cs-export-verify
          npx expo export --platform ios --output-dir /tmp/cs-export-verify --non-interactive
          test -d /tmp/cs-export-verify/_expo/static/js/ios \
            || { echo "Metro export produced no iOS bundle directory"; exit 1; }
          files=$(find /tmp/cs-export-verify -type f | wc -l)
          if [ "$files" -lt 5 ]; then
            echo "Metro export produced too few files ($files)"; exit 1
          fi
          echo "Metro iOS bundle OK ($files files, $(du -sh /tmp/cs-export-verify | cut -f1))"

  edge-functions:
    name: Supabase Edge Functions — parse gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Parse every function source (hard gate)
        # Nothing in CI used to look at apps/web/supabase/functions at all, so a
        # syntax error introduced into an edge function shipped straight to the
        # runtime. Node's type-stripping parser validates the whole tree with no
        # install step and no network: exit 1 on broken syntax, 0 on clean.
        run: |
          fail=0
          count=0
          for f in apps/web/supabase/functions/*/*.ts apps/web/supabase/functions/*.ts; do
            [ -f "$f" ] || continue
            count=$((count + 1))
            node --experimental-strip-types --check "$f" || { echo "PARSE FAIL: $f"; fail=1; }
          done
          [ "$count" -ge 10 ] || { echo "expected >=10 function sources, saw $count"; exit 1; }
          [ "$fail" -eq 0 ] && echo "Edge functions parse OK ($count files)"
          exit $fail

      - name: Deno typecheck (informational)
        # Real type errors exist here already (~11 at 2026-10-14), all of them
        # jsr supabase-js generic-inference noise from duck-typed helpers, plus
        # one over-narrow literal in product-enrich. Pinned non-blocking so the
        # job reports drift instead of red-lighting CI on pre-existing debt.
        # Re-read the count before ever promoting this to a hard gate.
        continue-on-error: true
        run: |
          curl -fsSL https://deno.land/install.sh | DENO_INSTALL=/tmp/deno sh -s -- -y >/dev/null 2>&1 || true
          /tmp/deno/bin/deno check apps/web/supabase/functions/*/index.ts 2>&1 | tail -30 || true

  guard:
    name: Repo hygiene guard
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: No agent/tool dirs or temp files in git
        run: |
          ! git ls-files | grep -E '^\.agent-teams/|^\.hermes/|^\.zcode/|supabase/\.temp/|\.DS_Store$' \
            || { echo "Tracked junk detected (see files above)"; exit 1; }

      - name: Verify the staff-role vocabulary matches the database
        # "Is this a staff account?" is written down four times: public.is_staff_or_admin()
        # in SQL (authoritative — it backs every *_admin_all RLS policy), apps/mobile/src/lib/
        # roles.ts, apps/web/src/lib/roles.ts, and _shared/auth.ts in the edge functions.
        # They used to disagree, and an `admin` account passed the database policies but was
        # locked out of its own staff UI. This reads the role list out of the latest
        # migration and requires all three clients to match it exactly, plus fail-closed
        # checks for unknown roles. No install, no database.
        # Negative control (2026-10-14): dropping "admin" from the mobile list turns the
        # mobile comparison and the helper-equivalence scenarios red.
        run: node --experimental-strip-types scripts/verify-role-vocabulary.mjs
