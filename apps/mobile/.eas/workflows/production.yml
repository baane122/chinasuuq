name: Production Builds & Submit

on:
  push:
    branches: ['main']
  workflow_dispatch:

jobs:
  build_android_production:
    type: build
    params:
      platform: android
      profile: production

  build_ios_production:
    type: build
    params:
      platform: ios
      profile: production

  submit_android:
    type: submit
    needs: [build_android_production]
    params:
      platform: android
      build_id: ${{ jobs.build_android_production.outputs.build_id }}

  submit_ios:
    type: submit
    needs: [build_ios_production]
    params:
      platform: ios
      build_id: ${{ jobs.build_ios_production.outputs.build_id }}
